<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- The page: tabs Status, Profiles, Settings (hash routing). Status polls /api/state and the last events every 5 s;
     the profile dropdown sends POST /api/active, the buttons POST /api/action. A button is enabled only in the states
     the controller accepts it in; one that still doesn't apply shows its `ignored` event. The Profiles and Settings
     forms are in editor.js, which uses the helpers below ($, rows, store, api) and the "state" event and gives back
     window.ruleSummary. No build step yet; deploy copies both files to :www. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smartac</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #fafafa; --dim: #6b6b6b; --line: #ddd; --bad: #b3261e;
          --warn: #8a5a00; --box: #fff; --accent: #2b5fb3; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --bg: #161616; --dim: #9a9a9a; --line: #333; --bad: #f2867e; --warn: #e0b04f;
            --box: #1f1f1f; --accent: #8fb4f0; }
  }
  body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  nav a { padding: 6px 12px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--fg); border-bottom-color: var(--accent); }
  .big { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .big div { font-size: 2rem; font-variant-numeric: tabular-nums; }
  .big small { display: block; font-size: .8rem; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--dim); width: 40%; }
  #err { color: var(--bad); min-height: 1.4em; }
  .badge { font-size: .75rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--dim);
           color: var(--dim); vertical-align: 2px; }
  select, input, button { font: inherit; }
  select, input { padding: 4px 6px; }
  #cycle { margin: 0 0 12px; }
  .acts { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .acts .row { margin: 0; gap: 6px; }
  .acts .row > b { font-weight: 600; font-size: .85rem; color: var(--dim); min-width: 4.5em; }
  .acts button { padding: 6px 12px; min-height: 2.5rem; }
  .acts select { min-height: 2.5rem; max-width: 100%; }
  #run-sum { color: var(--dim); font-size: .85rem; margin: 0; }
  #sent { color: var(--dim); font-size: .9rem; }
  #sent.bad { color: var(--bad); }
  .danger { color: var(--bad); }
  dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--box); color: var(--fg);
           max-width: 22rem; padding: 16px; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog .row { justify-content: flex-end; margin-top: 12px; }
  dialog button { padding: 6px 12px; min-height: 2.5rem; }
  h2 { font-size: .9rem; font-weight: 600; margin: 20px 0 4px; color: var(--dim); }
  #events td:first-child { width: 5.5em; }
  #events small { color: var(--dim); }
  /* editor (editor.js) */
  .card { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  details > summary { cursor: pointer; padding: 2px 0; }
  details > summary b { font-weight: 600; }
  .sum { color: var(--dim); font-size: .9rem; margin: 2px 0 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-end; }
  .f { display: inline-flex; flex-direction: column; font-size: .8rem; color: var(--dim); }
  .f > span { white-space: nowrap; }
  .f .in { display: flex; }
  .f input[type=number] { width: 4.2em; text-align: right; }
  .f input[type=text] { width: 9em; }
  .f input.wide { width: 14em; }
  .f input, .f select { color: var(--fg); font-size: 1rem; }
  .step { min-width: 2em; padding: 0; }
  .sep { align-self: center; padding: 0 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .tools button, .row button { padding: 2px 8px; }
  .phase { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; margin: 6px 0; }
  .bad > input, .bad > select, .bad .in input, input.bad, select.bad { outline: 2px solid var(--bad); }
  .card.bad, .phase.bad, div.bad { border-color: var(--bad); }
  .warn > input, .warn .in input, input.warn { outline: 2px solid var(--warn); }
  .msg { display: block; color: var(--bad); font-size: .8rem; margin: 2px 0; }
  .msg.w { color: var(--warn); }
  .bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 0;
         margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar .note { color: var(--dim); font-size: .9rem; flex: 1 1 10em; }
  .bar .note.bad { color: var(--bad); }
  .primary { font-weight: 600; }
  .lock { color: var(--dim); font-size: .8rem; }
  .hint { color: var(--dim); font-size: .85rem; margin: 4px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>smartac <span id="state"></span> <span id="shadow" class="badge" hidden>shadow</span>
    <span id="dryrun" class="badge" hidden>dry run</span></h1>
  <nav id="tabs"><a href="#status">Status</a><a href="#profiles">Profiles</a><a href="#settings">Settings</a></nav>
  <section id="status">
    <div class="big">
      <div><small>room</small><span id="temp">–</span></div>
      <div><small>humidity</small><span id="hum">–</span></div>
      <div><small>outdoor</small><span id="out">–</span></div>
      <div><small id="ac-sub">AC</small><span id="ac">–</span></div>
    </div>
    <p id="cycle"></p>
    <p id="err"></p>
    <div class="acts">
      <div class="row"><b>profile</b><select id="profile" disabled aria-label="profile"></select></div>
      <div class="row" id="pause"><b>pause</b>
        <button data-min="60">1 h</button><button data-min="120">2 h</button><button data-min="480">8 h</button>
        <button data-min="">until resumed</button><button id="resume">Resume</button></div>
      <div class="row"><b>run now</b><select id="run-profile" aria-label="profile to run"></select>
        <select id="run-rule" aria-label="rule to run"></select><button id="run">Run</button></div>
      <p id="run-sum"></p>
      <div class="row"><b>stop</b><button id="stop">Stop</button><button id="stop-now" class="danger">Stop now</button>
        <button id="clear">Clear manual hold</button></div>
      <span id="sent" aria-live="polite"></span>
    </div>
    <table id="rows"></table>
    <h2>events</h2>
    <table id="events"></table>
  </section>
  <dialog id="choice">
    <p id="choice-q"></p>
    <p class="hint">Finish: the fan phase dries the coil, then off. Leave running: the AC stays as it is, hands off.</p>
    <form method="dialog" class="row">
      <button value="cancel">Cancel</button><button value="leave">Leave running</button>
      <button value="finish" class="primary" autofocus>Finish</button>
    </form>
  </dialog>
  <section id="profiles" hidden></section>
  <section id="settings" hidden>
    <div id="settings-form"></div>
    <h2>device</h2>
    <table id="device"></table>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const deg = (v) => (v == null ? "–" : v.toFixed(1) + " °C");
const dur = (s) => {
  if (s == null) return "–";
  const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  return (d ? d + " d " : "") + (d || h ? h + " h " : "") + m + " min";
};
const kb = (b) => (b == null ? "–" : Math.round(b / 1024) + " KB");
const mins = (s) => (s == null ? "–" : Math.ceil(s / 60) + " min");
const clock = (age) => new Date(Date.now() - age * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const TOKEN_KEY = "smartac.token";
const TABS = ["status", "profiles", "settings"];

function store(get, value) {
  // localStorage may be missing or blocked (private mode): then the token is asked for each time.
  try {
    if (get) return localStorage.getItem(TOKEN_KEY);
    if (value == null) localStorage.removeItem(TOKEN_KEY); else localStorage.setItem(TOKEN_KEY, value);
  } catch (e) { /* not kept */ }
  return null;
}

async function api(method, path, body, ask = true) {
  // A request that needs the token. -> {status, data}; throws on a network error, a wrong or missing token.
  // ask: prompt for a token that isn't stored yet (false: give up quietly, e.g. a background validation).
  let token = store(true);
  if (!token && ask) token = prompt("API token (API_TOKEN in secrets.py)");
  if (!token) throw new Error("no token");
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "X-Token": token },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 401) { store(false, null); throw new Error("wrong token"); }
  store(false, token);
  let data = null;
  try { data = await r.json(); } catch (e) { /* no JSON body */ }
  return { status: r.status, data };
}

function rows(table, list) {
  table.replaceChildren(...list.map((cells) => {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement("td");
      if (c instanceof Node) td.append(c); else td.textContent = c;
      tr.append(td);
    }
    return tr;
  }));
}

function showTab() {
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "status";
  for (const t of TABS) $(t).hidden = t !== tab;
  for (const a of $("tabs").children) a.classList.toggle("on", a.hash === "#" + tab);
  document.dispatchEvent(new CustomEvent("tab", { detail: tab }));
}

function cycleText(s) {
  const c = s.cycle;
  if (s.booting) return "starting: waiting for the first AC read";
  if (s.state === "RUNNING" || s.state === "TAKEOVER") {
    const name = c.rule || "takeover";
    return name + ": phase " + c.phase + "/" + c.phases + " " + c.mode + ", " + mins(c.phase_left_s) + " left"
      + (c.goal ? ", until " + c.goal : "");
  }
  if (s.state === "STOPPING") return (c.rule || "takeover") + ": switching off";
  if (s.state === "COOLDOWN") return "cooldown, " + mins(s.cooldown_left_s) + " left";
  if (s.state === "MANUAL") return "hands off (AC set by hand), " + mins(s.manual_left_s) + " until takeover";
  if (s.state === "PAUSED") return s.paused_left_s == null ? "paused until resumed" : "paused, " + mins(s.paused_left_s) + " left";
  if (s.state === "IDLE") return s.profile === "off" ? "off: nothing runs" : "idle, watching the room";
  return "";
}

function renderProfiles(s) {
  const sel = $("profile");
  if (s.state === "OBSERVE" || s.booting) { sel.disabled = true; return; }
  const names = ["off", ...s.profiles.map((p) => p.name)];
  const key = names.join(",");
  if (sel.dataset.key !== key) {
    sel.replaceChildren(...[{ name: "off", label: "Off" }, ...s.profiles].map((p) => new Option(p.label, p.name)));
    sel.dataset.key = key;
  }
  if (document.activeElement !== sel && !sel.dataset.busy) sel.value = s.profile;
  sel.disabled = false;
}

// --- controls. last: the last /api/state; events: the last /api/events rows.
let last = null, events = [];
const CYCLING = ["RUNNING", "TAKEOVER"];

function choose(question) {
  // While a phase runs: finish it or leave the AC running? -> "finish", "leave" or null (cancelled).
  if (!last || !CYCLING.includes(last.state)) return Promise.resolve("finish");
  const d = $("choice");
  $("choice-q").textContent = question;
  d.returnValue = "cancel";
  d.showModal();
  return new Promise((done) => d.addEventListener("close", () => {
    done(d.returnValue === "cancel" || !d.returnValue ? null : d.returnValue);
  }, { once: true }));
}

function said(text, bad) {
  $("sent").textContent = text;
  $("sent").classList.toggle("bad", !!bad);
}

async function send(path, body) {
  // POST, then look again after the tick that applies it: an `ignored` event above the newest event seen before
  // the send is shown here (found by kind and message; ages tick on, so they only have to be no younger).
  said("sending…");
  const top = events[0];
  try {
    const r = await api("POST", path, body);
    if (r.status !== 202) throw new Error((r.data && r.data.error) || "HTTP " + r.status);
    if (r.data) render(r.data);
    said("sent");
  } catch (e) {
    said("not sent: " + e.message, true);
    return false;
  }
  setTimeout(async () => {
    await poll();
    const old = top ? events.findIndex((e) => e.kind === top.kind && e.msg === top.msg && e.age_s >= top.age_s) : -1;
    const ig = events.slice(0, old < 0 ? events.length : old).find((e) => e.kind === "ignored");
    said(ig ? "not applied: " + ig.msg : "", !!ig);
  }, 1500);
  return true;
}

async function setProfile(name) {
  const sel = $("profile");
  sel.dataset.busy = "1";
  const cycle = name === last.profile ? null : await choose("A phase is running. Switch to " + name + " and…");
  if (cycle) await send("/api/active", { profile: name, cycle });
  delete sel.dataset.busy;
  if (!cycle) sel.value = last.profile;
}

async function pause(minutes) {
  const cycle = await choose("A phase is running. Pause and…");
  if (cycle) send("/api/action", { action: "pause", minutes, cycle });
}

const act = (action, extra) => send("/api/action", Object.assign({ action }, extra));

function renderRun(s) {
  const p = $("run-profile"), r = $("run-rule");
  const key = s.profiles.map((x) => x.name + ":" + x.rules.join(",")).join(";");
  if (p.dataset.key !== key) {
    p.replaceChildren(...s.profiles.map((x) => new Option(x.label, x.name)));
    p.dataset.key = key;
    p.value = s.profiles.some((x) => x.name === s.profile) ? s.profile : (s.profiles[0] || {}).name;
    p.dataset.picked = "";
    fillRules();
  } else if (!p.dataset.picked && s.profiles.some((x) => x.name === s.profile) && p.value !== s.profile) {
    p.value = s.profile;  // follows the active profile until the owner picks one
    fillRules();
  }
}

function fillRules() {
  const prof = last && last.profiles.find((x) => x.name === $("run-profile").value);
  $("run-rule").replaceChildren(...(prof ? prof.rules : []).map((n, i) => new Option(n, i)));
  showSummary();
}

let docs = null;  // GET /api/profiles, for the summaries; fetched again when the rules change
async function showSummary() {
  const out = $("run-sum"), name = $("run-profile").value, i = +$("run-rule").value;
  out.textContent = "";
  if (!name || !window.ruleSummary) return;
  const key = $("run-profile").dataset.key;
  if (!docs || docs.key !== key) {
    try {
      const r = await fetch("/api/profiles", { cache: "no-store" });
      docs = r.ok ? { key, doc: await r.json() } : null;
    } catch (e) { docs = null; }
  }
  const rule = docs && docs.doc.profiles[name] && docs.doc.profiles[name].rules[i];
  out.textContent = rule ? window.ruleSummary(rule) : "";
}

function renderActions(s) {
  // Enabled only where the controller accepts it; nothing in observe mode, only Pause while booting.
  const st = s.state, live = st !== "OBSERVE", ready = live && !s.booting, ac = s.ac;
  const on = (id, ok) => { $(id).disabled = !ok; };
  if (live) renderRun(s);
  for (const b of $("pause").querySelectorAll("button[data-min]")) b.disabled = !live || st === "PAUSED";
  on("resume", ready && (st === "PAUSED" || s.pause_pending));
  const runnable = ready && (st === "IDLE" || st === "COOLDOWN") && ac.reachable && !ac.power;
  on("run", runnable && $("run-rule").options.length > 0);
  on("run-profile", ready);
  on("run-rule", ready);
  on("stop", ready && ["RUNNING", "MANUAL", "TAKEOVER"].includes(st));
  on("stop-now", ready && (CYCLING.includes(st) || (st === "MANUAL" && ac.power === true)));
  on("clear", ready && st === "MANUAL");
}

function acText(s) {
  const ac = s.ac;
  if (!ac.reachable) {
    return "unreachable" + (s.unreachable_s != null ? " for " + dur(s.unreachable_s) : "")
      + (s.last_error ? " (" + s.last_error + ")" : "");
  }
  return (ac.power ? "on" : "off") + ", " + ac.mode + (ac.target_c != null ? " " + ac.target_c + " °C" : "")
    + (ac.fan ? ", fan " + ac.fan : "");
}

function render(s) {
  const d = s.device;
  last = s;
  $("state").textContent = s.state;
  $("shadow").hidden = !s.shadow;
  $("dryrun").hidden = s.shadow || !s.dry_run;  // shadow mode always runs dry
  $("cycle").textContent = cycleText(s);
  renderProfiles(s);
  renderActions(s);
  $("temp").textContent = deg(s.room.temp);
  $("hum").textContent = s.room.hum == null ? "–" : s.room.hum + " %";
  $("out").textContent = deg(s.outdoor_temp);
  const ac = s.ac;
  $("ac").textContent = !ac.reachable ? "?" : ac.power ? "on" : "off";
  $("ac-sub").textContent = !ac.reachable ? "AC"
    : "AC " + ac.mode + (ac.target_c != null ? " " + ac.target_c + "°" : "") + (ac.fan ? " fan " + ac.fan : "");
  $("err").textContent = [
    s.unreachable_s != null
      ? "AC not reachable for " + dur(s.unreachable_s) + (s.last_error ? " (" + s.last_error + ")" : "") : "",
    s.last_write_error ? "last write: " + s.last_write_error : "",
    s.config_warning || "",
  ].filter(Boolean).join(" · ");
  rows($("rows"), [
    ["AC", acText(s)],
    ["reads", s.reads + " (" + s.read_errors + " failed), writes " + s.writes + " (" + s.write_errors + " failed)"],
  ]);
  const resets = Object.entries(d.resets || {}).map(([k, v]) => k + " " + v).join(", ");
  rows($("device"), [
    ["AC", acText(s)],
    ["uptime", dur(d.uptime_s)],
    ["boot", d.boot + " (" + d.reset_cause + ")"],
    ["resets", resets || "–"],
    ["last crash", d.last_crash || "–"],
    ["heap free", kb(d.heap_free) + ", largest block " + kb(d.heap_max_block)],
    ["Wi-Fi", (d.rssi == null ? "down" : d.rssi + " dBm") + ", drops " + (d.wifi_drops ?? "–")
      + ", reconnects " + (d.wifi_reconnects ?? "–") + ", for the AC " + (d.ac_reconnects ?? "–")],
    ["IP", d.ip || "–"],
    ["firmware", d.fw],
  ]);
  document.dispatchEvent(new CustomEvent("state", { detail: s }));
}

function renderEvents(list) {
  events = list;
  rows($("events"), list.map((e) => {
    const msg = document.createElement("span");
    msg.textContent = e.kind + ": " + e.msg + " ";
    const room = document.createElement("small");
    room.textContent = e.temp == null ? "" : e.temp.toFixed(1) + " °C " + (e.hum == null ? "" : e.hum + " %");
    msg.append(room);
    return [e.age_s == null ? "–" : clock(e.age_s), msg];
  }));
}

let timer = null;
async function poll() {
  clearTimeout(timer);
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
    const e = await fetch("/api/events?limit=15", { cache: "no-store" });
    if (e.ok) renderEvents(await e.json());
  } catch (e) {
    $("err").textContent = "Pico not reachable (" + e.message + ")";
  }
  timer = setTimeout(poll, 5000);
}
$("profile").addEventListener("change", (ev) => setProfile(ev.target.value));
for (const b of $("pause").querySelectorAll("button[data-min]")) {
  b.addEventListener("click", () => pause(b.dataset.min ? +b.dataset.min : null));
}
$("resume").addEventListener("click", () => act("resume"));
$("run-profile").addEventListener("change", (ev) => { ev.target.dataset.picked = "1"; fillRules(); });
$("run-rule").addEventListener("change", showSummary);
$("run").addEventListener("click", () => act("run", { profile: $("run-profile").value, rule: +$("run-rule").value }));
$("stop").addEventListener("click", () => act("stop"));
$("stop-now").addEventListener("click", () => {
  if (confirm("Switch the AC off now, without the fan phase?")) act("stop_now");
});
$("clear").addEventListener("click", () => act("clear_manual"));
window.addEventListener("hashchange", showTab);
</script>
<script src="/editor.js"></script>
<script>
showTab();
poll();
</script>
</body>
</html>
