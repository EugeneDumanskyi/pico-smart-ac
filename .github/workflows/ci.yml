# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/smartac/micropython-v1.29.0  # MPY_DIR default in the Makefile
          key: micropython-v1.29.0-${{ runner.os }}-${{ hashFiles('tools/build_micropython.sh') }}
      - run: make micropython
      - run: make test

  month:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/smartac/micropython-v1.29.0  # MPY_DIR default in the Makefile
          key: micropython-v1.29.0-${{ runner.os }}-${{ hashFiles('tools/build_micropython.sh') }}
      - run: make micropython
      - run: make month
